<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영자의 오늘 운세</title>
<meta property="og:title" content="영자의 오늘 운세">
<meta property="og:description" content="이름과 생년월일만 넣으면, 영자가 오늘 운세를 봐 드려요.">
<meta property="og:image" content="assets/yeongja.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Song+Myung&family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4ead6;
    --paper-dark: #e8d9b8;
    --ink: #2a1f17;
    --red: #b8282a;
    --gold: #b8892f;
    --brush: 'East Sea Dokdo', 'Song Myung', serif;
    --myung: 'Song Myung', serif;
    --sans: 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.55), transparent 45%),
                      radial-gradient(circle at 90% 90%, rgba(184,137,47,.12), transparent 40%);
    min-height: 100vh;
    font-size: 22px;
    line-height: 1.4;
  }
  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 40px; }
  .hidden { display: none !important; }

  /* 상단 */
  .brand { text-align: center; margin: 4px 0 8px; }
  .brand .sub { font-family: var(--myung); font-size: 20px; color: var(--gold); }
  .brand h1 { font-family: var(--brush); font-weight: 400; font-size: 64px; line-height: 1; margin: 2px 0 0; color: var(--red); }

  /* 영자 + 말풍선 */
  .yeongja { position: relative; display: flex; align-items: flex-end; gap: 10px; margin: 8px 0 18px; }
  .yeongja .pic { position: relative; width: 140px; height: 160px; flex: none; }
  .yeongja .pic::before {
    content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%;
    left: 10px; top: 0; background: radial-gradient(circle, #f0c75e 0%, #d9a93a 70%, rgba(217,169,58,0) 72%);
    opacity: .85;
  }
  .yeongja.warn .pic::before { background: radial-gradient(circle, #c9463f 0%, #8f1f1f 70%, rgba(143,31,31,0) 72%); }
  .yeongja img { position: relative; width: 100%; height: 100%; object-fit: contain; object-position: bottom; }
  .yeongja .noimg {
    position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-family: var(--brush); font-size: 56px; color: var(--ink);
  }
  .bubble {
    position: relative; flex: 1; background: #fbf5e6; border: 2px solid var(--paper-dark);
    border-radius: 18px; padding: 14px 16px 18px; margin-bottom: 30px;
    font-family: var(--myung); font-size: 24px; line-height: 1.35; word-break: keep-all;
    box-shadow: 0 3px 0 rgba(0,0,0,.06);
  }
  .bubble::after {
    content: ""; position: absolute; left: -14px; bottom: 18px; border: 8px solid transparent;
    border-right: 14px solid #fbf5e6; border-left: 0;
  }
  .seal {
    position: absolute; right: -6px; bottom: -14px; width: 42px; height: 42px; background: var(--red);
    color: #fbf1dc; font-family: var(--myung); font-size: 15px; line-height: 1.05;
    display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: 6px; transform: rotate(-6deg);
  }

  /* 입력 */
  label.field { display: block; margin: 0 0 18px; }
  label.field > span { display: block; font-weight: 900; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; font: inherit; font-size: 24px; padding: 14px 14px; border-radius: 14px;
    border: 2px solid #cdb98f; background: #fffaf0; color: var(--ink); appearance: none;
  }
  .birth { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  .gender { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gender button {
    font: inherit; font-size: 24px; font-weight: 900; padding: 14px; border-radius: 14px;
    border: 2px solid #cdb98f; background: #fffaf0; color: var(--ink);
  }
  .gender button[aria-pressed=true] { background: var(--ink); color: #fbf1dc; border-color: var(--ink); }
  .btn {
    display: block; width: 100%; font: inherit; font-size: 28px; font-weight: 900; padding: 18px;
    border: 0; border-radius: 18px; background: var(--red); color: #fff7e8; margin-top: 8px;
    box-shadow: 0 4px 0 #7e1a1b; cursor: pointer; text-decoration: none; text-align: center;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #7e1a1b; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid #cdb98f; box-shadow: none; font-size: 22px; padding: 14px; }
  .btn.yt { background: var(--ink); box-shadow: 0 4px 0 #000; font-size: 22px; padding: 14px; }
  .err { color: var(--red); font-weight: 900; min-height: 1.4em; margin: 0 0 6px; }

  /* 결과 */
  .meta { text-align: center; font-size: 20px; color: #6b5a44; }
  .who { text-align: center; font-weight: 900; font-size: 24px; margin-top: 2px; }
  .head {
    text-align: center; font-family: var(--brush); font-weight: 400; font-size: 60px; line-height: 1.05;
    margin: 10px 0 16px; color: var(--ink); word-break: keep-all;
  }
  .head.great, .head.same { color: var(--red); }
  .head.chung, .head.wonjin { color: var(--red); text-shadow: 2px 2px 0 rgba(0,0,0,.08); }
  .card {
    display: flex; align-items: center; gap: 14px; background: #fffaf0; border-radius: 18px;
    padding: 14px 18px; margin-bottom: 12px; border: 2px solid var(--paper-dark);
  }
  .card .tag { flex: none; font-weight: 900; font-size: 20px; padding: 6px 10px; border-radius: 10px; }
  .card.good .tag { background: #2f6b3f; color: #fff; }
  .card.bad .tag { background: var(--red); color: #fff; }
  .card .val { font-family: var(--myung); font-size: 32px; line-height: 1.2; word-break: keep-all; }
  .card.bad .val { color: var(--red); }
  .lucky { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 6px; }
  .lucky div { background: #fffaf0; border-radius: 16px; padding: 12px 6px; text-align: center; border: 2px solid var(--paper-dark); }
  .lucky small { display: block; font-size: 18px; color: #6b5a44; font-weight: 900; }
  .lucky b { display: block; font-family: var(--myung); font-weight: 400; font-size: 30px; margin-top: 4px; }
  .swatch { display: inline-block; width: 24px; height: 24px; border-radius: 50%; vertical-align: -3px; border: 2px solid rgba(0,0,0,.2); margin-right: 4px; }
  .actions { display: grid; gap: 10px; margin-top: 14px; }
  .note { text-align: center; font-size: 16px; color: #8a7558; margin-top: 18px; }
</style>
</head>
<body>
<script>
  // 영자 그림이 없을 때 대신 보여줄 글자
  function noImg(img) {
    var d = document.createElement('div'); d.className = 'noimg'; d.textContent = '영자';
    img.replaceWith(d);
  }
</script>
<main>
  <header class="brand">
    <div class="sub">영자의 팔자풀이</div>
    <h1>오늘 운세</h1>
  </header>

  <!-- 입력 화면 -->
  <section id="form-view">
    <div class="yeongja">
      <div class="pic"><img class="yj-img" src="assets/yeongja.png" alt="영자" onerror="noImg(this)"></div>
      <div class="bubble">오늘 운세,<br>영자가 봐 드릴게요<span class="seal">영자</span></div>
    </div>

    <label class="field"><span>이름</span>
      <input id="name" type="text" maxlength="10" placeholder="예) 김영자" autocomplete="name">
    </label>

    <div class="field">
      <label class="field" style="margin:0"><span>생년월일 (양력)</span></label>
      <div class="birth">
        <select id="by" aria-label="태어난 해"></select>
        <select id="bm" aria-label="태어난 달"></select>
        <select id="bd" aria-label="태어난 날"></select>
      </div>
    </div>
    <div style="height:18px"></div>

    <div class="field">
      <label class="field" style="margin:0"><span>성별</span></label>
      <div class="gender">
        <button type="button" data-g="f" aria-pressed="false">여자</button>
        <button type="button" data-g="m" aria-pressed="false">남자</button>
      </div>
    </div>
    <div style="height:18px"></div>

    <p class="err" id="err"></p>
    <button class="btn" id="go">오늘 운세 보기</button>
  </section>

  <!-- 결과 화면 -->
  <section id="result-view" class="hidden">
    <div class="meta" id="r-meta"></div>
    <div class="who" id="r-who"></div>
    <div class="head" id="r-head"></div>

    <div class="card good"><span class="tag">좋아요</span><span class="val" id="r-good"></span></div>
    <div class="card bad"><span class="tag">조심</span><span class="val" id="r-bad"></span></div>

    <div class="lucky">
      <div><small>행운의 색</small><b id="r-color"></b></div>
      <div><small>행운의 숫자</small><b id="r-num"></b></div>
      <div><small>좋은 방향</small><b id="r-dir"></b></div>
    </div>

    <div class="yeongja" id="r-yeongja">
      <div class="pic"><img class="yj-img" src="assets/yeongja.png" alt="영자" onerror="noImg(this)"></div>
      <div class="bubble"><span id="r-say"></span><span class="seal">영자</span></div>
    </div>

    <div class="actions">
      <button class="btn" id="share">친구에게도 알려주기</button>
      <a class="btn yt" id="yt" target="_blank" rel="noopener">영자아씨 채널 가기</a>
      <button class="btn ghost" id="again">다른 사람 보기</button>
    </div>
    <p class="note">재미로 보는 오늘의 운세예요. 내일 또 오세요!</p>
  </section>
</main>

<script src="fortune.js"></script>
<script>
  // ▼ 채널 주소는 여기서 바꾸세요
  var CHANNEL_URL = 'https://www.youtube.com/@영자아씨';
  var STORE = 'yeongja-fortune-v1';

  var $ = function (id) { return document.getElementById(id); };
  var gender = '';

  function fill(sel, from, to, suffix, def) {
    for (var i = from; i <= to; i++) {
      var o = document.createElement('option'); o.value = i; o.textContent = i + suffix;
      if (i === def) o.selected = true;
      sel.appendChild(o);
    }
  }
  var thisYear = new Date().getFullYear();
  fill($('by'), 1925, thisYear, '년', 1960);
  fill($('bm'), 1, 12, '월', 1);
  fill($('bd'), 1, 31, '일', 1);

  function setGender(g) {
    gender = g;
    Array.prototype.forEach.call(document.querySelectorAll('.gender button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.g === g ? 'true' : 'false');
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.gender button'), function (b) {
    b.addEventListener('click', function () { setGender(b.dataset.g); });
  });

  // 지난번 입력 기억하기
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) {
      $('name').value = saved.name || '';
      var p = (saved.birth || '').split('-');
      if (p.length === 3) { $('by').value = +p[0]; $('bm').value = +p[1]; $('bd').value = +p[2]; }
      if (saved.gender) setGender(saved.gender);
    }
  } catch (e) {}

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function show(input) {
    var f = YeongjaFortune.getFortune(input, new Date());
    $('r-meta').textContent = f.date + ' · ' + f.dayName;
    $('r-who').textContent = f.name + '님 · ' + f.yy + '년생 ' + f.animal + '띠 ' + f.emoji;
    $('r-head').textContent = f.head;
    $('r-head').className = 'head ' + f.level;
    $('r-good').textContent = f.good;
    $('r-bad').textContent = f.careful;
    $('r-color').innerHTML = '<span class="swatch" style="background:' + f.color.c + '"></span>' + f.color.n;
    $('r-num').textContent = f.number;
    $('r-dir').textContent = f.direction;
    $('r-say').textContent = f.say;
    $('r-yeongja').classList.toggle('warn', f.level === 'chung' || f.level === 'wonjin');
    $('form-view').classList.add('hidden');
    $('result-view').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  $('go').addEventListener('click', function () {
    var name = $('name').value.trim();
    var y = +$('by').value, m = +$('bm').value, d = +$('bd').value;
    var dt = new Date(y, m - 1, d);
    if (!name) { $('err').textContent = '이름을 넣어 주세요.'; $('name').focus(); return; }
    if (dt.getMonth() !== m - 1) { $('err').textContent = '날짜를 다시 확인해 주세요.'; return; }
    if (!gender) { $('err').textContent = '성별을 골라 주세요.'; return; }
    $('err').textContent = '';
    var input = { name: name, birth: y + '-' + pad(m) + '-' + pad(d), gender: gender };
    try { localStorage.setItem(STORE, JSON.stringify(input)); } catch (e) {}
    show(input);
  });

  $('again').addEventListener('click', function () {
    $('name').value = ''; setGender('');
    $('result-view').classList.add('hidden');
    $('form-view').classList.remove('hidden');
    window.scrollTo(0, 0);
  });

  $('yt').href = CHANNEL_URL;

  $('share').addEventListener('click', function () {
    var url = location.href.split('#')[0].split('?')[0];
    var text = '영자가 오늘 운세 봐 준대요 🔮';
    if (navigator.share) { navigator.share({ title: '영자의 오늘 운세', text: text, url: url }).catch(function () {}); return; }
    var done = function () { $('share').textContent = '주소가 복사됐어요!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('이 주소를 복사하세요', url); });
    else prompt('이 주소를 복사하세요', url);
  });
</script>
</body>
</html>
