<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영자의 오늘 운세</title>
<meta property="og:title" content="영자의 오늘 운세">
<meta property="og:description" content="내 띠만 누르면, 영자가 오늘 운세를 봐 드려요.">
<meta property="og:image" content="assets/yeongja.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2e8d5;
    --tile: #faf4e8;
    --ink: #2b2420;
    --sub: #5e5246;
    --line: #d3c4a6;
    --red: #b2171c;
    --green: #1d6b34;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: var(--sans); font-weight: 500; color: var(--ink); background: var(--bg); font-size: 24px; line-height: 1.45; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 32px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 영자 */
  .yeongja { display: flex; align-items: center; gap: 14px; }
  .pic { width: 92px; height: 92px; flex: none; border-radius: 50%; overflow: hidden; background: #e6d6b4; border: 2px solid var(--line); }
  .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }
  .yeongja p { margin: 0; font-size: 26px; font-weight: 800; word-break: keep-all; }

  /* 1단계 */
  .title { text-align: center; font-family: var(--serif); font-weight: 900; font-size: 40px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .grid button { background: var(--tile); border: 2px solid #c2b08c; border-radius: 12px; padding: 8px 0 10px; }
  .grid .emo { display: block; font-size: 46px; line-height: 1.15; }
  .grid .nm { display: block; font-size: 26px; font-weight: 800; }

  /* 2단계 */
  .ask { text-align: center; font-size: 30px; font-weight: 800; margin: 8px 0 18px; }
  .ask .emo { display: block; font-size: 64px; line-height: 1.1; }
  .years { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .years button { background: var(--tile); border: 2px solid #c2b08c; border-radius: 12px; padding: 18px 0; font-size: 32px; font-weight: 800; }
  .grid button:active, .years button:active { background: #e9dcc2; }

  /* 결과 */
  .who { text-align: center; font-size: 28px; font-weight: 800; }
  .who small { display: block; font-size: 22px; font-weight: 500; color: var(--sub); }
  .saja { text-align: center; padding: 18px 0 20px; margin: 14px 0 0; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--line); }
  .saja-word { font-family: var(--serif); font-weight: 900; font-size: 64px; line-height: 1.1; letter-spacing: 6px; }
  .saja-hanja { font-family: var(--serif); font-weight: 700; font-size: 24px; color: var(--sub); letter-spacing: 10px; }
  .saja-mean { font-size: 30px; font-weight: 800; margin-top: 6px; word-break: keep-all; }
  .line { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .line .lb { font-size: 22px; font-weight: 800; }
  .line .tx { font-size: 32px; font-weight: 800; line-height: 1.3; word-break: keep-all; }
  .line.good .lb { color: var(--green); }
  .line.bad .lb, .line.bad .tx { color: var(--red); }
  .lucky { display: flex; padding: 16px 0; border-bottom: 3px solid var(--ink); }
  .lucky > div { flex: 1; text-align: center; }
  .lucky > div + div { border-left: 1px solid var(--line); }
  .lucky .lb { font-size: 22px; color: var(--sub); font-weight: 800; }
  .lucky .tx { font-size: 34px; font-weight: 800; }
  .dot { display: inline-block; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #888; vertical-align: -2px; margin-right: 6px; }
  .r-yj { margin: 18px 0 6px; }

  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 18px; margin-top: 12px;
    font-size: 28px; font-weight: 800; text-align: center; text-decoration: none; }
  .btn.kakao { background: #f9de4b; color: #2b2420; }
  .btn.yt { background: var(--ink); color: #fff; }
  .link { display: block; margin: 18px auto 0; background: none; border: 0; font-size: 24px; color: var(--sub); text-decoration: underline; }
</style>
</head>
<body>
<script>
  function noImg(img) { var d = document.createElement('div'); d.className = 'noimg'; d.textContent = '영자'; img.replaceWith(d); }
</script>
<main>

  <!-- 1단계: 띠 고르기 -->
  <section id="step-animal">
    <h1 class="title">영자의 오늘 운세</h1>
    <div class="yeongja">
      <div class="pic"><img src="assets/yeongja.png" alt="영자" onerror="noImg(this)"></div>
      <p>무슨 띠세요?<br>내 띠를 눌러 주세요.</p>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 2단계: 년생 고르기 -->
  <section id="step-year" class="hidden">
    <div class="ask" id="ask"></div>
    <div class="years" id="years"></div>
    <button class="link" id="back1">띠 다시 고르기</button>
  </section>

  <!-- 결과 -->
  <section id="step-result" class="hidden">
    <div class="who" id="r-who"></div>

    <div class="saja">
      <div class="saja-word" id="r-word"></div>
      <div class="saja-hanja" id="r-hanja"></div>
      <div class="saja-mean" id="r-mean"></div>
    </div>

    <div class="line good"><div class="lb">◎ 좋은 일</div><div class="tx" id="r-good"></div></div>
    <div class="line bad"><div class="lb">▲ 조심</div><div class="tx" id="r-bad"></div></div>

    <div class="lucky">
      <div><div class="lb">행운의 색</div><div class="tx" id="r-color"></div></div>
      <div><div class="lb">행운의 숫자</div><div class="tx" id="r-num"></div></div>
    </div>

    <div class="yeongja r-yj">
      <div class="pic"><img src="assets/yeongja.png" alt="영자" onerror="noImg(this)"></div>
      <p id="r-say"></p>
    </div>

    <button class="btn kakao" id="share">카톡으로 보내기</button>
    <a class="btn yt" id="yt" target="_blank" rel="noopener">영자아씨 영상 보러 가기</a>
    <button class="link" id="again">다른 띠 보기</button>
  </section>

</main>

<script src="fortune.js"></script>
<script>
  // ▼ 채널 주소는 여기서 바꾸세요
  var CHANNEL_URL = 'https://www.youtube.com/@영자아씨';
  var STORE = 'yeongja-year';
  var F = window.YeongjaFortune;
  var $ = function (id) { return document.getElementById(id); };

  function go(step) {
    ['step-animal', 'step-year', 'step-result'].forEach(function (s) { $(s).classList.toggle('hidden', s !== step); });
    window.scrollTo(0, 0);
  }

  // 띠 버튼 12개
  F.ANIMALS.forEach(function (name, i) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="emo">' + F.ANIMAL_EMOJI[i] + '</span><span class="nm">' + name + '띠</span>';
    b.onclick = function () { pickAnimal(i); };
    $('grid').appendChild(b);
  });

  // 띠를 누르면 그 띠의 년생 버튼(1930~2001년생)
  function pickAnimal(i) {
    $('ask').innerHTML = '<span class="emo">' + F.ANIMAL_EMOJI[i] + '</span>' + F.ANIMALS[i] + '띠, 몇 년생이세요?';
    $('years').innerHTML = '';
    for (var y = 1930; y <= 2001; y++) {
      if (F.yearBranch(y) !== i) continue;
      (function (year) {
        var b = document.createElement('button');
        b.textContent = String(year).slice(2) + '년생';
        b.onclick = function () { showResult(year); };
        $('years').appendChild(b);
      })(y);
    }
    go('step-year');
  }

  function showResult(year) {
    try { localStorage.setItem(STORE, year); } catch (e) {}
    var f = F.getFortune({ year: year }, new Date());
    $('r-who').innerHTML = f.yy + '년생 ' + f.animal + '띠 ' + f.emoji + '<small>' + f.date + ' 오늘의 운세</small>';
    $('r-word').textContent = f.saja[0];
    $('r-hanja').textContent = f.saja[1];
    $('r-mean').textContent = f.saja[2];
    $('r-good').textContent = f.good;
    $('r-bad').textContent = f.careful;
    $('r-color').innerHTML = '<span class="dot" style="background:' + f.color.c + '"></span>' + f.color.n;
    $('r-num').textContent = f.number;
    $('r-say').textContent = '“' + f.say + '”';
    go('step-result');
  }

  $('back1').onclick = function () { go('step-animal'); };
  $('again').onclick = function () { try { localStorage.removeItem(STORE); } catch (e) {} go('step-animal'); };
  $('yt').href = CHANNEL_URL;

  $('share').onclick = function () {
    var url = location.href.split('#')[0].split('?')[0];
    var text = '영자가 오늘 운세 봐 준대요. 띠만 누르면 돼요.';
    if (navigator.share) { navigator.share({ title: '영자의 오늘 운세', text: text, url: url }).catch(function () {}); return; }
    var done = function () { $('share').textContent = '주소가 복사됐어요!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(done, function () { prompt('이 주소를 복사하세요', url); });
    else prompt('이 주소를 복사하세요', url);
  };

  // 다시 들어오면 바로 내 운세
  var saved = null;
  try { saved = +localStorage.getItem(STORE); } catch (e) {}
  if (saved >= 1900) showResult(saved);
</script>
</body>
</html>
