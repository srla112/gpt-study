<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky control bar over a dense, scannable channel list; one row per channel, status chip on the left */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1a1d23; --muted:#5d6472; --line:#e1e4ea;
  --accent:#d6402b; --accent-soft:#fbe9e6;
  --good:#1f7a4d; --good-soft:#e2f3ea; --skip:#7a7f89; --skip-soft:#eceef2; --seen:#2f5fb3; --seen-soft:#e6eefb;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --surface:#1b1e24; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2c3039;
  --accent:#ff7a63; --accent-soft:#3a201b;
  --good:#5fd39a; --good-soft:#173326; --skip:#8f95a1; --skip-soft:#262a31; --seen:#86aef5; --seen-soft:#1c2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e24; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2c3039;
  --accent:#ff7a63; --accent-soft:#3a201b;
  --good:#5fd39a; --good-soft:#173326; --skip:#8f95a1; --skip-soft:#262a31; --seen:#86aef5; --seen-soft:#1c2840; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header{padding-block:22px 14px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:10px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn:hover,.seg button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:12px;color:var(--muted);font-size:13px}
.progress b{color:var(--fg);font-family:var(--font-num);font-weight:500}
.meter{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.list{display:flex;flex-direction:column;gap:6px;padding-bottom:40px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.row.st-good{border-color:var(--good)}
.row.st-skip{opacity:.62}
.chip{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:3px;background:var(--skip-soft);color:var(--skip)}
.st-seen .chip{background:var(--seen-soft);color:var(--seen)}
.st-good .chip{background:var(--good-soft);color:var(--good)}
.main{min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-weight:700;font-size:15px;color:var(--fg);text-decoration:none;word-break:break-word}
.name:hover{color:var(--accent);text-decoration:underline}
.name::after{content:" ↗";color:var(--muted);font-weight:400;font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:12.5px}
.meta .num{font-family:var(--font-num);color:var(--fg)}
.new{color:var(--accent);font-weight:500}
.vid{color:var(--muted);font-size:13px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vid:hover{color:var(--fg);text-decoration:underline}
.vid b{font-family:var(--font-num);font-weight:500;color:var(--accent)}
.act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.act button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer}
.act button.on-good{background:var(--good);border-color:var(--good);color:var(--surface)}
.act button.on-skip{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr)}
  .chip{justify-self:start}
  .act{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.grade{font-size:11.5px;border-radius:999px;padding:0 8px;background:var(--accent-soft);color:var(--accent)}
.grade.g-mid{background:var(--seen-soft);color:var(--seen)}.grade.g-low,.grade.g-none{background:var(--skip-soft);color:var(--skip)}
.no{font-family:var(--font-num);color:var(--muted);font-size:12px}
#cat button{font-weight:500}
</style>
</head>

<script>
(function(){
  const items=JSON.parse(document.getElementById('data').textContent);
  items.forEach(i=>i.id=i.url);
  const KEY='webtoon-status-v1'; let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=n=>!n?'-':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'만':n.toLocaleString('ko-KR');
  const label={'':'미확인',seen:'열어봄',good:'후보',skip:'제외'};
  const gcls={'상':'g-high','중':'g-mid','하':'g-low'};
  const f={cat:'webtoon',grade:'',active:'',status:''};
  [['cat','cat'],['gradeSeg','grade'],['activeSeg','active'],['status','status']].forEach(([id,k])=>$(id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); f[k]=b.dataset.v; render();}));
  ['q','sort'].forEach(id=>$(id).addEventListener('input',render));
  function progress(pool){
    const c={'':0,seen:0,good:0,skip:0}; pool.forEach(i=>c[st[i.id]||'']++);
    const t=pool.length||1,p=k=>c[k]/t*100+'%';
    $('progress').innerHTML=`<span>이 분류 <b>${pool.length}</b></span><span>미확인 <b>${c['']}</b></span><span>열어봄 <b>${c.seen}</b></span><span>후보 <b>${c.good}</b></span><span>제외 <b>${c.skip}</b></span><span class="meter" aria-hidden="true"><i style="width:${p('good')};background:var(--good)"></i><i style="width:${p('seen')};background:var(--seen)"></i><i style="width:${p('skip')};background:var(--skip)"></i></span>`;
  }
  function render(){
    const q=$('q').value.trim().toLowerCase(), sort=$('sort').value;
    const pool=items.filter(i=>i.cat===f.cat);
    let list=pool.filter(i=>{
      const s=st[i.id]||'';
      if(f.status==='todo'&&s) return false; if(f.status&&f.status!=='todo'&&s!==f.status) return false;
      if(f.grade&&i.grade!==f.grade) return false;
      if(f.active&&!(parseInt(i.m30)>0)) return false;
      if(q&&!((i.name+' '+i.top+' '+i.latest).toLowerCase().includes(q))) return false;
      return true;});
    const srcRank=i=>i.src==='사연 목록'?0:1;
    const by={no:(a,b)=>srcRank(a)-srcRank(b)||a.no-b.no,subsD:(a,b)=>b.subs-a.subs,subsA:(a,b)=>a.subs-b.subs,avg:(a,b)=>b.avg-a.avg,tv:(a,b)=>b.tv-a.tv,recent:(a,b)=>a.d-b.d};
    list.sort(by[sort]);
    $('list').innerHTML=list.length?list.map(i=>{
      const s=st[i.id]||'';
      const g=i.grade==='기준 채널'?'<span class="grade">기준 채널</span>':`<span class="grade ${gcls[i.grade]||'g-none'}">유사도 ${esc(i.grade)}</span>`;
      return `<div class="row st-${s||'todo'}" data-k="${esc(i.id)}"><span class="chip">${label[s]}</span>
        <div class="main"><div><span class="no">${esc(i.src)} ${i.no}번</span> <a class="name" href="${esc(i.url)}" target="_blank" rel="noopener" data-open="1">${esc(i.name)}</a></div>
        <div class="meta">${g}<span>구독자 <span class="num">${esc(i.subsT)}</span></span><span>영상 <span class="num">${esc(i.nv)}</span>개</span><span>평균 ${esc(i.len)}</span><span>최근 10개 평균 <span class="num">${fmt(i.avg)}</span>회</span><span>최근 업로드 ${esc(i.recent||'-')} ${i.op?esc(i.op):''}</span><span>최근 30일 ${esc(i.m30||0)}개</span></div>
        ${i.turl?`<a class="vid" href="${esc(i.turl)}" target="_blank" rel="noopener"><b>${fmt(i.tv)}</b> · ${esc(i.top)}</a>`:''}</div>
        <div class="act"><button data-set="good" class="${s==='good'?'on-good':''}">후보</button><button data-set="skip" class="${s==='skip'?'on-skip':''}">제외</button><button data-set="">초기화</button></div></div>`;
    }).join(''):'<p class="empty">조건에 맞는 채널이 없습니다. 필터를 바꿔 보세요.</p>';
    progress(pool);
  }
  $('list').addEventListener('click',e=>{
    const row=e.target.closest('.row'); if(!row) return; const k=row.dataset.k;
    if(e.target.closest('a[data-open]')){ if(!st[k]){st[k]='seen';save();setTimeout(render,50);} return; }
    const b=e.target.closest('button[data-set]'); if(!b) return;
    if(b.dataset.set) st[k]=b.dataset.set; else delete st[k]; save(); render();
  });
  function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200);}
  const catName={sayeon:'사연',yadam:'야담',webtoon:'웹툰형',tiktok:'틱톡형',none:'미분류'};
  $('copy').addEventListener('click',()=>{
    const g=items.filter(i=>st[i.id]==='good'); if(!g.length){toast('후보로 표시한 채널이 아직 없습니다');return;}
    const text=g.map(i=>[catName[i.cat],i.src+' '+i.no+'번',i.name,i.subsT,i.url].join('\t')).join('\n');
    const done=()=>toast(`후보 ${g.length}개를 복사했습니다`);
    navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done();}catch(e){toast('복사가 막혀 있습니다. 브라우저 권한을 확인하세요');} ta.remove();});
  });
  render();
})();
</script>
</body>
</html>
