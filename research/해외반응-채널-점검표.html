<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해외반응 채널 점검표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control bar over a dense, scannable channel list; one row per channel, status chip on the left */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1a1d23; --muted:#5d6472; --line:#e1e4ea;
  --accent:#d6402b; --accent-soft:#fbe9e6;
  --good:#1f7a4d; --good-soft:#e2f3ea; --skip:#7a7f89; --skip-soft:#eceef2; --seen:#2f5fb3; --seen-soft:#e6eefb;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --surface:#1b1e24; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2c3039;
  --accent:#ff7a63; --accent-soft:#3a201b;
  --good:#5fd39a; --good-soft:#173326; --skip:#8f95a1; --skip-soft:#262a31; --seen:#86aef5; --seen-soft:#1c2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e24; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2c3039;
  --accent:#ff7a63; --accent-soft:#3a201b;
  --good:#5fd39a; --good-soft:#173326; --skip:#8f95a1; --skip-soft:#262a31; --seen:#86aef5; --seen-soft:#1c2840; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header{padding-block:22px 14px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:10px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn:hover,.seg button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:12px;color:var(--muted);font-size:13px}
.progress b{color:var(--fg);font-family:var(--font-num);font-weight:500}
.meter{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.list{display:flex;flex-direction:column;gap:6px;padding-bottom:40px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.row.st-good{border-color:var(--good)}
.row.st-skip{opacity:.62}
.chip{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:3px;background:var(--skip-soft);color:var(--skip)}
.st-seen .chip{background:var(--seen-soft);color:var(--seen)}
.st-good .chip{background:var(--good-soft);color:var(--good)}
.main{min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-weight:700;font-size:15px;color:var(--fg);text-decoration:none;word-break:break-word}
.name:hover{color:var(--accent);text-decoration:underline}
.name::after{content:" ↗";color:var(--muted);font-weight:400;font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:12.5px}
.meta .num{font-family:var(--font-num);color:var(--fg)}
.new{color:var(--accent);font-weight:500}
.vid{color:var(--muted);font-size:13px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vid:hover{color:var(--fg);text-decoration:underline}
.vid b{font-family:var(--font-num);font-weight:500;color:var(--accent)}
.act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.act button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer}
.act button.on-good{background:var(--good);border-color:var(--good);color:var(--surface)}
.act button.on-skip{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr)}
  .chip{justify-self:start}
  .act{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="wrap">
  <h1>해외반응 채널 점검표</h1>
  <p class="sub">구독자 5만 미만, 한국 관련 반응 롱폼이 10만 회 이상 나온 채널 543개입니다(2026년 10월 30일 기준). 채널명을 누르면 새 탭에서 열리고 ‘열어봄’으로 표시됩니다. 표시는 이 브라우저에만 저장됩니다.</p>
</header>

<div class="bar">
  <div class="wrap">
    <input type="search" id="q" placeholder="채널명·영상 제목 검색" aria-label="검색">
    <select id="topic" aria-label="주제">
      <option value="">모든 주제</option>
      <option>여행·생활</option><option>음식</option><option>스포츠</option>
      <option>K팝·음악</option><option>드라마·영화</option><option>경제·기술·방산</option>
    </select>
    <select id="sort" aria-label="정렬">
      <option value="subs">구독자 적은 순</option>
      <option value="views">최고 조회수 높은 순</option>
      <option value="ratio">구독자 대비 조회수 높은 순</option>
      <option value="recent">최근 업로드 순</option>
    </select>
    <div class="seg" id="status" role="group" aria-label="상태">
      <button data-v="" aria-pressed="true">전체</button>
      <button data-v="todo" aria-pressed="false">미확인</button>
      <button data-v="seen" aria-pressed="false">열어봄</button>
      <button data-v="good" aria-pressed="false">후보</button>
      <button data-v="skip" aria-pressed="false">제외</button>
    </div>
    <div class="seg" id="activeSeg" role="group" aria-label="활동 여부">
      <button data-v="" aria-pressed="true">활동 무관</button>
      <button data-v="1" aria-pressed="false">최근 한 달 내 업로드</button>
    </div>
    <button class="btn" id="copy">후보 목록 복사</button>
  </div>
</div>

<main class="wrap">
  <div class="progress" id="progress"></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const raw = JSON.parse(document.getElementById('data').textContent);
  const UNIT = {'초':1/86400,'분':1/1440,'시간':1/24,'일':1,'주':7,'개월':30,'년':365};
  const days = s => { const m = /(\d+)\s*(초|분|시간|일|주|개월|년)/.exec(s||''); return m ? +m[1]*UNIT[m[2]] : 1e9; };
  const rows = raw.map((r,i)=>({i,name:r[0],url:r[1],subs:r[2],subsT:r[3],views:r[4],title:r[5]||'',vurl:r[6],topics:r[7]||'',recent:r[8],note:r[9],n100:r[10],d:days(r[8])}));
  const KEY='reaction-channel-status-v1';
  let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
  const keyOf=r=>r.url;
  const label={'':'미확인',seen:'열어봄',good:'후보',skip:'제외'};
  const fmt=n=>n>=1e4?(n/1e4).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'만':n.toLocaleString('ko-KR');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $=id=>document.getElementById(id);
  let fStatus='', fActive='';

  function segInit(id,set){
    $(id).addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      set(b.dataset.v); render();
    });
  }
  segInit('status',v=>fStatus=v); segInit('activeSeg',v=>fActive=v);
  ['q','topic','sort'].forEach(id=>$(id).addEventListener('input',render));

  function progress(){
    const c={'':0,seen:0,good:0,skip:0};
    rows.forEach(r=>c[st[keyOf(r)]||'']++);
    const tot=rows.length, pct=k=>(c[k]/tot*100)+'%';
    $('progress').innerHTML=
      `<span>전체 <b>${tot}</b></span><span>미확인 <b>${c['']}</b></span><span>열어봄 <b>${c.seen}</b></span><span>후보 <b>${c.good}</b></span><span>제외 <b>${c.skip}</b></span>`+
      `<span class="meter" aria-hidden="true"><i style="width:${pct('good')};background:var(--good)"></i><i style="width:${pct('seen')};background:var(--seen)"></i><i style="width:${pct('skip')};background:var(--skip)"></i></span>`;
  }

  function render(){
    const q=$('q').value.trim().toLowerCase(), topic=$('topic').value, sort=$('sort').value;
    let list=rows.filter(r=>{
      const s=st[keyOf(r)]||'';
      if(fStatus==='todo'&&s) return false;
      if(fStatus&&fStatus!=='todo'&&s!==fStatus) return false;
      if(fActive&&r.d>31) return false;
      if(topic&&!r.topics.includes(topic)) return false;
      if(q&&!(r.name.toLowerCase().includes(q)||r.title.toLowerCase().includes(q))) return false;
      return true;
    });
    const by={subs:(a,b)=>a.subs-b.subs,views:(a,b)=>b.views-a.views,ratio:(a,b)=>b.views/Math.max(1,b.subs)-a.views/Math.max(1,a.subs),recent:(a,b)=>a.d-b.d};
    list.sort(by[sort]);
    $('list').innerHTML=list.length?list.map(r=>{
      const s=st[keyOf(r)]||'';
      return `<div class="row st-${s||'todo'}" data-k="${esc(keyOf(r))}">
        <span class="chip">${label[s]}</span>
        <div class="main">
          <a class="name" href="${esc(r.url)}" target="_blank" rel="noopener" data-open="1">${esc(r.name)}</a>
          <div class="meta"><span>구독자 <span class="num">${esc(r.subsT)}</span></span><span>최고 <span class="num">${fmt(r.views)}</span>회</span><span>10만+ 롱폼 <span class="num">${r.n100}</span>개</span><span>최근 업로드 ${esc(r.recent||'-')}</span>${r.topics?`<span>${esc(r.topics)}</span>`:''}${r.note?`<span class="new">${esc(r.note)}</span>`:''}</div>
          <a class="vid" href="${esc(r.vurl)}" target="_blank" rel="noopener"><b>${fmt(r.views)}</b> · ${esc(r.title)}</a>
        </div>
        <div class="act">
          <button data-set="good" class="${s==='good'?'on-good':''}">후보</button>
          <button data-set="skip" class="${s==='skip'?'on-skip':''}">제외</button>
          <button data-set="">초기화</button>
        </div>
      </div>`;}).join(''):'<p class="empty">조건에 맞는 채널이 없습니다. 필터를 바꿔 보세요.</p>';
    progress();
  }

  $('list').addEventListener('click',e=>{
    const row=e.target.closest('.row'); if(!row) return;
    const k=row.dataset.k;
    if(e.target.closest('a[data-open]')){ if(!st[k]){ st[k]='seen'; save(); setTimeout(render,50); } return; }
    const b=e.target.closest('button[data-set]'); if(!b) return;
    if(b.dataset.set) st[k]=b.dataset.set; else delete st[k];
    save(); render();
  });

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
  $('copy').addEventListener('click',()=>{
    const g=rows.filter(r=>st[keyOf(r)]==='good');
    if(!g.length){ toast('후보로 표시한 채널이 아직 없습니다'); return; }
    const text=g.map(r=>`${r.name}\t${r.subsT}\t${r.views}\t${r.url}`).join('\n');
    navigator.clipboard.writeText(text).then(()=>toast(`후보 ${g.length}개를 복사했습니다`)).catch(()=>{
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast(`후보 ${g.length}개를 복사했습니다`); }catch(e){ toast('복사가 막혀 있습니다. 브라우저 권한을 확인하세요'); }
      ta.remove();
    });
  });
  render();
})();
</script>
</body>
</html>
