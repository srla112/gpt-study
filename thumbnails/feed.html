<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;src:url("fonts/NotoSansKR[wght].ttf");font-weight:100 900}
body{margin:0;background:#0f0f0f;font-family:NS;color:#f1f1f1;width:1280px;padding:28px 32px;box-sizing:border-box}
h3{font-size:18px;font-weight:700;color:#aaa;margin:0 0 14px}
.row{display:flex;gap:28px;margin-bottom:34px}
.card{width:360px}.card img{width:360px;height:202px;border-radius:12px;display:block;object-fit:cover}
.wrap{position:relative}.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font-size:12px;font-weight:600;padding:1px 4px;border-radius:4px}
.t{font-size:16px;font-weight:600;line-height:22px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{font-size:14px;color:#aaa;margin-top:4px}
.small{display:flex;gap:16px;align-items:flex-start}
.s168{width:168px;height:94px;border-radius:8px}.s240{width:240px;height:135px;border-radius:8px}
.lab{font-size:13px;color:#aaa;margin-top:6px}
</style></head><body>
<h3>유튜브 다크모드 피드 (360px)</h3>
<div class="row">
 <div class="card"><div class="wrap"><img src="cheonsal.jpg"><span class="dur">12:34</span></div>
  <div class="t">천살 방향 딱 4곳｜2027년 정미년 천살 드는 띠(원숭이·쥐·용)와 내 띠 천살·반안살 자리</div><div class="m">영자아씨</div></div>
 <div class="card"><div class="wrap"><img src="ref_fatesaju_cheonsal.jpg"><span class="dur">9:59</span></div>
  <div class="t">2027년 정미년 원숭이띠·쥐띠·용띠｜천살 드는 해, 무너지는 사람과 올라가는 사람 차이 딱 하나</div><div class="m">사주 명운상점 · 조회수 66만회</div></div>
</div>
<h3>작은 크기 (168px 추천 칸 · 240px 모바일 검색)</h3>
<div class="small">
 <div><img class="s168" src="cheonsal.jpg"><div class="lab">영자 168</div></div>
 <div><img class="s240" src="cheonsal.jpg"><div class="lab">영자 240</div></div>
 <div><img class="s168" src="ref_fatesaju_cheonsal.jpg"><div class="lab">명운상점 168</div></div>
 <div><img class="s240" src="ref_fatesaju_cheonsal.jpg"><div class="lab">명운상점 240</div></div>
</div>
</body></html>
