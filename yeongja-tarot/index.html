<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141a31">
<title>영자의 타로</title>
<meta property="og:title" content="영자의 타로">
<meta property="og:description" content="고민 하나 떠올리고, 카드 한 장만 뽑으세요. 영자가 풀어 드려요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://srla112.github.io/gpt-study/yeongja-tarot/">
<meta property="og:image" content="https://srla112.github.io/gpt-study/yeongja-tarot/assets/share.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 타로는 밤하늘 테마 하나만 쓴다 (깊은 남색 + 금빛 별, 미색 글씨) */
  :root {
    --bg: #141a31;
    --tile: #212a4e;
    --ink: #f3e9d2;
    --sub: #c8bfa8;
    --line: #3b4672;
    --border: #b8933f;
    --press: #2b3663;
    --picbg: #2b3663;
    --gold: #e6c46e;
    --red: #f08a7e;
    --navy: #3d0f1c;
    --navy2: #6e1d31;
    --foil: #e2bd62;
    --kakao: #f9de4b;
    --sub-btn: #b2171c;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: var(--sans); font-weight: 500; color: var(--ink); font-size: 24px; line-height: 1.45; min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 38% at 50% -4%, rgba(230,196,110,.22), transparent 70%),
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,240,200,.8), transparent 60%),
      radial-gradient(1.2px 1.2px at 82% 12%, rgba(255,240,200,.7), transparent 60%),
      radial-gradient(1.8px 1.8px at 68% 34%, rgba(255,240,200,.6), transparent 60%),
      radial-gradient(1.2px 1.2px at 28% 46%, rgba(255,240,200,.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 90% 58%, rgba(255,240,200,.55), transparent 60%),
      radial-gradient(1.2px 1.2px at 8% 72%, rgba(255,240,200,.5), transparent 60%),
      radial-gradient(1.6px 1.6px at 52% 84%, rgba(255,240,200,.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 76% 92%, rgba(255,240,200,.45), transparent 60%),
      linear-gradient(180deg, #1b2342 0%, #141a31 45%, #10152a 100%);
    background-attachment: fixed; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 32px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .title { text-align: center; font-family: var(--serif); font-weight: 900; font-size: 42px; margin: 4px 0 0; letter-spacing: 2px; color: var(--gold); text-shadow: 0 0 18px rgba(230,196,110,.35); }
  .title::before, .title::after { content: '✦'; font-size: 22px; vertical-align: 12px; margin: 0 10px; }
  .title-sub { text-align: center; font-size: 22px; color: var(--sub); font-weight: 800; margin: 2px 0 18px; }
  .yeongja { display: flex; align-items: center; gap: 14px; }
  .pic { width: 92px; height: 92px; flex: none; border-radius: 50%; overflow: hidden; background: var(--picbg); border: 3px solid var(--gold); box-shadow: 0 0 14px rgba(230,196,110,.35); }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }
  .yeongja p { margin: 0; font-size: 26px; font-weight: 800; word-break: keep-all; }

  /* 첫 화면 부채꼴 카드 */
  .fan { position: relative; height: 150px; margin: 0 0 18px; }
  .fan .face { width: 76px; height: 130px; left: 50%; top: 10px; right: auto; bottom: auto; margin-left: -38px; border-radius: 9px; transform-origin: 50% 110%; }
  .fan .face:nth-child(1) { z-index: 1; transform: rotate(-28deg) translateY(6px); }
  .fan .face:nth-child(2) { z-index: 2; transform: rotate(-14deg); }
  .fan .face:nth-child(3) { z-index: 3; transform: rotate(0deg) translateY(-6px); box-shadow: 0 0 22px rgba(230,196,110,.45), 0 8px 20px rgba(0,0,0,.55); }
  .fan .face:nth-child(4) { z-index: 2; transform: rotate(14deg); }
  .fan .face:nth-child(5) { z-index: 1; transform: rotate(28deg) translateY(6px); }
  .fan .back .star { font-size: 11px; } .fan .back .nm { font-size: 12px; letter-spacing: 2px; }
  .fan .back::before { inset: 4px; }

  /* 1단계: 주제 */
  .ask { font-size: 30px; font-weight: 800; text-align: center; margin: 22px 0 14px; }
  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topics button { background: var(--tile); border: 2px solid var(--border); border-radius: 14px; padding: 16px 0 14px; }
  .topics .ic { display: block; font-size: 44px; line-height: 1.15; }
  .topics .lb { display: block; font-size: 28px; font-weight: 800; }
  .topics button:active { background: var(--press); }

  /* 카드 뒷면·앞면 */
  .tcard { position: relative; aspect-ratio: 7 / 12; perspective: 1000px; border: 0; padding: 0; background: none; }
  .tcard .inner { position: absolute; inset: 0; transition: transform .8s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .tcard.flipped .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.55); }
  .back {
    background:
      radial-gradient(circle at 50% 50%, rgba(216,180,90,.18) 0 28%, transparent 29%),
      repeating-linear-gradient(45deg, rgba(216,180,90,.10) 0 2px, transparent 2px 12px),
      linear-gradient(160deg, var(--navy2), var(--navy));
    border: 3px solid var(--foil);
  }
  .back::before { content: ""; position: absolute; inset: 7px; border: 1.5px solid rgba(216,180,90,.75); border-radius: 7px; }
  .back .moon { position: absolute; left: 50%; top: 50%; width: 42%; aspect-ratio: 1; transform: translate(-50%, -62%); border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #f6dc8e, var(--foil) 60%, #a8822f); box-shadow: 0 0 18px rgba(246,220,142,.45); }
  .back .moon::after { content: ""; position: absolute; width: 82%; height: 82%; left: 30%; top: 2%; border-radius: 50%; background: var(--navy2); }
  .back .star { position: absolute; color: var(--foil); font-size: 18px; line-height: 1; }
  .back .s1 { left: 14%; top: 10%; } .back .s2 { right: 14%; top: 10%; } .back .s3 { left: 14%; bottom: 10%; } .back .s4 { right: 14%; bottom: 10%; }
  .back .nm { position: absolute; left: 0; right: 0; bottom: 20%; text-align: center; font-family: var(--serif); font-weight: 900; font-size: 20px; color: var(--foil); letter-spacing: 4px; }
  .front { transform: rotateY(180deg); background: #f5ecd7; }
  .front img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 2단계: 카드 고르기 */
  .pickhead { text-align: center; font-size: 28px; font-weight: 800; margin: 6px 0 4px; min-height: 2.9em; word-break: keep-all; }
  .topic-chip { display: block; text-align: center; font-size: 22px; color: var(--gold); font-weight: 800; }
  .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 10px; }
  .spread .tcard { animation: deal .55s cubic-bezier(.2,.8,.3,1) both; }
  .spread .tcard:nth-child(1) { --dx: 115%; animation-delay: .05s; }
  .spread .tcard:nth-child(2) { --dx: 0%; animation-delay: .25s; }
  .spread .tcard:nth-child(3) { --dx: -115%; animation-delay: .45s; }
  @keyframes deal { from { transform: translate(var(--dx), -30px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .spread.ready .tcard:not(.flipped):hover, .spread.ready .tcard:not(.flipped):focus-visible { transform: translateY(-8px); }
  .spread .tcard { transition: transform .25s, opacity .4s; }
  .spread.done .tcard:not(.flipped) { opacity: .25; }
  .hint { text-align: center; font-size: 22px; color: var(--sub); }

  /* 결과 */
  .result-card { width: 62%; margin: 8px auto 0; }
  .result-card .tcard { width: 100%; }
  .result-card .face { box-shadow: 0 0 28px rgba(230,196,110,.35), 0 12px 28px rgba(0,0,0,.6); border: 3px solid var(--foil); }
  .rname { text-align: center; font-family: var(--serif); font-weight: 900; font-size: 46px; color: var(--gold); line-height: 1.15; margin-top: 16px; word-break: keep-all; }
  .rkey { text-align: center; font-size: 28px; font-weight: 800; color: var(--ink); }
  .rmsg { margin: 16px 0 0; padding: 18px 0; border-top: 2px solid var(--gold); border-bottom: 1px solid var(--line); }
  .rmsg .lb { font-size: 22px; font-weight: 800; color: var(--sub); }
  .rmsg .tx { font-size: 32px; font-weight: 800; line-height: 1.35; word-break: keep-all; }
  .r-yj { margin: 18px 0 6px; }
  .fade-in { animation: fadein .7s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .speak { display: block; margin: 12px auto 0; font-size: 24px; font-weight: 800; padding: 10px 22px; border-radius: 999px; background: transparent; }
  .speak.on { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .speak { color: var(--gold); border: 2px solid var(--gold); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 18px; margin-top: 12px;
    font-size: 28px; font-weight: 800; text-align: center; text-decoration: none; }
  .btn.kakao { background: var(--kakao); color: #2b2420; }
  .btn.sub { background: var(--sub-btn); color: #fff; }
  .btn.yt { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
  .link { display: block; margin: 18px auto 0; background: none; border: 0; font-size: 24px; color: var(--sub); text-decoration: underline; text-align: center; }
  .note { text-align: center; font-size: 18px; color: var(--sub); margin-top: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .spread .tcard, .fade-in { animation: none; }
    .tcard .inner { transition: none; }
  }
</style>
</head>
<body>
<script>
  function noImg(img) { var d = document.createElement('div'); d.className = 'noimg'; d.textContent = '영자'; img.replaceWith(d); }
</script>
<main>

  <!-- 1단계: 주제 고르기 -->
  <section id="step-topic">
    <h1 class="title">영자의 타로</h1>
    <div class="title-sub">카드 한 장으로 보는 오늘의 답</div>
    <div class="fan" aria-hidden="true"><div class="face back"></div><div class="face back"></div><div class="face back"></div><div class="face back"></div><div class="face back"></div></div>
    <div class="yeongja">
      <div class="pic"><img src="assets/yeongja.jpg" alt="영자" onerror="noImg(this)"></div>
      <p>고민 하나를<br>떠올려 보세요.</p>
    </div>
    <div class="ask">무엇이 궁금하세요?</div>
    <div class="topics" id="topics"></div>
  </section>

  <!-- 2단계: 카드 고르기 -->
  <section id="step-pick" class="hidden">
    <span class="topic-chip" id="p-topic"></span>
    <div class="pickhead" id="p-head"></div>
    <div class="spread" id="spread"></div>
    <div class="hint" id="p-hint">&nbsp;</div>
    <button class="link" id="back1">주제 다시 고르기</button>
  </section>

  <!-- 결과 -->
  <section id="step-result" class="hidden">
    <span class="topic-chip" id="r-topic"></span>
    <div class="result-card fade-in"><div class="tcard flipped" aria-hidden="true"><div class="inner">
      <div class="face back"></div>
      <div class="face front"><img id="r-img" alt=""></div>
    </div></div></div>
    <div class="fade-in" style="animation-delay:.25s">
      <div class="rname" id="r-name"></div>
      <div class="rkey" id="r-key"></div>
      <div class="rmsg"><div class="lb" id="r-lb"></div><div class="tx" id="r-msg"></div></div>
      <button class="speak" id="speak">🔊 소리로 듣기</button>
      <div class="yeongja r-yj">
        <div class="pic"><img src="assets/yeongja.jpg" alt="영자" onerror="noImg(this)"></div>
        <p id="r-say"></p>
      </div>
    </div>

    <button class="btn kakao" id="share">카톡으로 보내기</button>
    <a class="btn sub" id="sub" target="_blank" rel="noopener">영자아씨 구독하기</a>
    <a class="btn yt" id="yt" target="_blank" rel="noopener">채널로 바로 가기</a>
    <button class="link" id="again">다른 고민으로 다시 뽑기</button>
    <a class="link" href="../yeongja-fortune/">영자의 오늘 운세도 보기</a>
    <p class="note">카드 그림: 라이더-웨이트 타로(1909)</p>
  </section>

</main>

<script src="cards.js"></script>
<script>
  // ▼ 채널 주소는 여기서 바꾸세요
  var CHANNEL_URL = 'https://www.youtube.com/@영자아씨';
  var CARDS = window.TAROT_CARDS, TOPICS = window.TAROT_TOPICS;
  var $ = function (id) { return document.getElementById(id); };
  var topic = 'today';
  var BACK = '<span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✦</span><span class="star s4">✦</span><span class="moon"></span><span class="nm">영자</span>';
  Array.prototype.forEach.call(document.querySelectorAll('.face.back'), function (b) { b.innerHTML = BACK; });

  // 카드 그림 미리 불러오기
  CARDS.forEach(function (c) { var i = new Image(); i.src = 'cards/' + c.no + '.jpg'; });

  function go(step) {
    if (window.stopSpeak) stopSpeak();
    ['step-topic', 'step-pick', 'step-result'].forEach(function (s) { $(s).classList.toggle('hidden', s !== step); });
    window.scrollTo(0, 0);
  }

  Object.keys(TOPICS).forEach(function (k) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="ic">' + TOPICS[k].icon + '</span><span class="lb">' + TOPICS[k].label + '</span>';
    b.onclick = function () { startPick(k); };
    $('topics').appendChild(b);
  });

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function startPick(k) {
    topic = k;
    var t = TOPICS[k];
    $('p-topic').textContent = t.icon + ' ' + t.label;
    $('p-head').textContent = '카드를 섞고 있어요…';
    $('p-hint').innerHTML = '&nbsp;';
    var deal = shuffle(CARDS).slice(0, 3);
    var spread = $('spread');
    spread.className = 'spread';
    spread.innerHTML = '';
    deal.forEach(function (c, i) {
      var b = document.createElement('button');
      b.className = 'tcard';
      b.setAttribute('aria-label', (i + 1) + '번째 카드');
      b.innerHTML = '<div class="inner"><div class="face back">' + BACK + '</div><div class="face front"><img src="cards/' + c.no + '.jpg" alt=""></div></div>';
      b.onclick = function () { pick(b, c); };
      spread.appendChild(b);
    });
    go('step-pick');
    setTimeout(function () {
      spread.classList.add('ready');
      $('p-head').textContent = '마음 가는 카드를 눌러 주세요.';
      $('p-hint').textContent = '천천히 골라도 괜찮아요.';
    }, 1100);
  }

  function pick(el, c) {
    var spread = $('spread');
    if (!spread.classList.contains('ready') || spread.classList.contains('done')) return;
    spread.classList.add('done');
    el.classList.add('flipped');
    $('p-head').textContent = c.name + ' 카드가 나왔어요.';
    $('p-hint').innerHTML = '&nbsp;';
    setTimeout(function () { showResult(c); }, 1300);
  }

  function showResult(c) {
    var t = TOPICS[topic];
    $('r-topic').textContent = t.icon + ' ' + t.label + '에 대한 카드';
    $('r-img').src = 'cards/' + c.no + '.jpg';
    $('r-img').alt = c.name + ' 카드';
    $('r-name').textContent = c.name;
    $('r-key').textContent = c.key;
    $('r-lb').textContent = t.icon + ' ' + t.label;
    $('r-msg').textContent = c[topic];
    $('r-say').textContent = '“' + c.say + '”';
    // 애니메이션 다시 시작
    Array.prototype.forEach.call(document.querySelectorAll('#step-result .fade-in'), function (e) {
      e.classList.remove('fade-in'); void e.offsetWidth; e.classList.add('fade-in');
    });
    SPEECH = t.label + '에 대한 카드는 ' + c.name + ' 카드입니다. ' + c.key + '. '
      + c[topic] + ' ' + c.say;
    go('step-result');
  }

  // ── 소리로 듣기: 휴대폰에 들어 있는 읽어 주기 기능(음성 합성)을 쓴다 ──
  var SPEECH = '';
  var canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function koVoice() {
    var vs = canSpeak ? speechSynthesis.getVoices() : [];
    for (var i = 0; i < vs.length; i++) if (/^ko/i.test(vs[i].lang)) return vs[i];
    return null;
  }
  function stopSpeak() {
    if (canSpeak) speechSynthesis.cancel();
    var b = $('speak'); if (b) { b.classList.remove('on'); b.textContent = '🔊 소리로 듣기'; }
  }
  function speak() {
    if (!canSpeak) return;
    if (speechSynthesis.speaking) { stopSpeak(); return; }
    var u = new SpeechSynthesisUtterance(SPEECH);
    u.lang = 'ko-KR'; u.rate = 0.85; u.pitch = 1.05;
    var v = koVoice(); if (v) u.voice = v;
    u.onend = u.onerror = stopSpeak;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    $('speak').classList.add('on'); $('speak').textContent = '■ 그만 듣기';
  }
  if (!canSpeak) $('speak').classList.add('hidden');
  else { speechSynthesis.getVoices(); $('speak').onclick = speak; }

  $('back1').onclick = function () { go('step-topic'); };
  $('again').onclick = function () { go('step-topic'); };
  $('sub').href = CHANNEL_URL + '?sub_confirmation=1';
  $('yt').href = CHANNEL_URL;

  $('share').onclick = function () {
    var url = location.href.split('#')[0].split('?')[0];
    var text = '영자가 타로 카드로 고민을 풀어 준대요. 한 장만 뽑으면 돼요.';
    if (navigator.share) { navigator.share({ title: '영자의 타로', text: text, url: url }).catch(function () {}); return; }
    var done = function () { $('share').textContent = '주소가 복사됐어요!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(done, function () { prompt('이 주소를 복사하세요', url); });
    else prompt('이 주소를 복사하세요', url);
  };
</script>
</body>
</html>
